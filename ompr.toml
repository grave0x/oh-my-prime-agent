# oh-my-prime-agent config (alias: ompa)
[package]
version = "0.2.1"

[resource]
maxLoad1 = 9           # 75% of 12 cores
minMemAvailMB = 1200
maxSwapUsedMB = 8000
pollMs = 1500
maxHoldMs = 240000
maxJobs = 4
niceLevel = 19
ioClass = 3
governOmpWorkers = true   # omp-internal jobs (inference/embed/tts/stt) also throttled (OPTIMIZE.md S2)

[fleet]
maxSubagents = 15      # hard cap on live subagents; new work queues at the cap
offloadSleepMs = 30000 # idle-sleep threshold before a waiting agent offloads
dormantMs = 2000       # renderer idle before a TUI goes dormant (focus-aware)
focusDormant = true    # prerequisite gate for unbounded TUI count (§7.3)
reapGraceMs = 60000    # finished-but-unreaped grace before the governor reaps

[inference]
idleTimeoutMs = 120000 # omp background worker idle → shutdown, respawn on demand

[hygiene]
artifactMaxAgeDays = 14  # ompa gc: dead sessions' artifacts/transcripts older than this
logMaxMB = 8             # per state file (usage/chat/notif/runs); rotate on write
runGcOnTick = true       # native governor tick, not a manual command

[inject]
rateLimitTurns = 10      # resource context re-injected only on pressure change or every N turns

[kernel]
backend = "auto"          # auto | stateless | stateful (hot-swap: /kernel <mode>)
timeoutMs = 120000        # stateless runner timeout
maxOutputChars = 65536    # stdout/stderr cap per call
guidance = true           # inject backend choice guidance per turn

[plugins]
enabled = ["resource-guard", "global-chat", "souls", "notif-box", "bash-first", "self-profiler", "ompa-tui", "kernel-pilot"]

[tui]
panels = ["resource", "chat", "notifs", "souls", "fleet", "profile", "upstream", "help"]  # dashboard panels, in order
refreshMs = 2000          # dashboard panel refresh interval
statusWidget = true       # compact one-line status above the editor
statusRefreshMs = 5000    # status widget refresh interval

[upstream]
# Upstream-drift watcher: checks priv builds vs upstreams, notifies at
# higher priority and files deduped GitHub issues on lag. Config + state
# live in ~/.omp/upstream-watch.json (shared with the pi-side omp ext).
# Env: OMP_WATCH=0|1, OMP_WATCH_INTERVAL_HOURS. Manual run: /ompa upstream.
enabled = true
intervalHours = 6
issueOnLag = true
githubUser = "grave0x"

[refine]
primeAccess = true        # /refine may emit audited `prime` edits (gate file mirrors this)

[theme]
name = "cp2077"

[souls]
dir = "~/.prime/agent/souls"
reserved = ["grave"]
